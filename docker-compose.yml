version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "8080:80"
    environment:
      # In production, this can be changed to an external URL (e.g. https://api.example.com)
      BACKEND_URL: "http://backend:8000"
    networks:
      - gtfs-network

networks:
  gtfs-network:
    external: true
